services:
  service:
    build:
      context: .
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      LOG_LEVEL: info
      POSTGRES_URL: postgres://logstream:logstream@database:5432/logstream
      POSTGRES_POOL_SIZE: 8
      PARTITION_LOOKAHEAD_DAYS: 3
      CURSOR_SECRET: local-compose-secret
      RETENTION_DAYS: 30
      RETENTION_INTERVAL_MINUTES: 60
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:8080/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: logstream
      POSTGRES_USER: logstream
      POSTGRES_PASSWORD: logstream
    ports:
      - "5432:5432"
    volumes:
      - logstream-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logstream -d logstream"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  logstream-postgres:
